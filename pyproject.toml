[project]
name = "notebooklm-fleet"
version = "0.2.0"
description = "Multi-account Gemini Notebook / NotebookLM quota monitor, Studio analytics, Google Drive hub, and task orchestrator"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20.0",
    "fastapi>=0.115.0",
    "fastmcp>=2.0.0",
    "google-auth>=2.35.0",
    "google-auth-oauthlib>=1.2.0",
    "httpx>=0.27.0",
    "notebooklm-py[browser,cookies]>=0.8.6",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
