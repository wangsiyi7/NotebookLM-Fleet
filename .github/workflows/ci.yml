name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run offline unit & protocol tests
        env:
          PYTHONUTF8: "1"
        run: uv run python -m pytest -v -k "not test_live_official_mcp_public_probe"

      - name: Compile-check application package
        run: uv run python -m compileall -q app tests
